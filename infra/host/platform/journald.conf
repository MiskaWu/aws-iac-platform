# 平台的 journald 設定：install.sh 放到 /etc/systemd/journald.conf.d/10-platform.conf（docs/host-platform.md「日誌保留」）。
# 主機上所有日誌（含 edge-caddy 的存取紀錄與裡面的 IP）保留 30 天：各專案的隱私說明照這個數字寫（負責人 2026-10-15 定）。
# MaxFileSec：journald 整個檔一起刪，檔裡最新的一筆也超過保留期才刪。預設一個檔最長一個月，實際會拖到將近 60 天；
# 每天換一個檔，實際保留才會落在 30～31 天。
[Journal]
MaxRetentionSec=30day
MaxFileSec=1day
