name: opentofu

on:
  pull_request:
    paths:
      - "infra/**"
      - ".opentofu-version"
      - ".github/workflows/opentofu.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".opentofu-version"
      - ".github/workflows/opentofu.yml"

permissions:
  contents: read
  id-token: write # 讓 job 能向 GitHub 取得 OIDC token，換 AWS 臨時憑證

concurrency:
  group: opentofu-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-east-2

defaults:
  run:
    working-directory: infra

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: opentofu/setup-opentofu@v2
        with:
          # 和 Makefile 讀同一個檔，本機、CloudShell、CI 用同一版
          tofu_version_file: .opentofu-version

      # 讀不到版本檔時 action 只發警告、改裝 latest，在這裡擋下
      - run: tofu version | grep -xF "OpenTofu v$(cat ../.opentofu-version)" >/dev/null
      - run: tofu fmt -check -recursive
      - run: tofu init -input=false
      - run: tofu validate
      - run: tofu plan -input=false -lock-timeout=5m

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 不要在這個 job 加 environment:。加了之後 OIDC 的 sub 會變成
    # repo:OWNER/REPO:environment:NAME，apply 角色的信任政策就不會符合。
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: opentofu/setup-opentofu@v2
        with:
          # 和 Makefile 讀同一個檔，本機、CloudShell、CI 用同一版
          tofu_version_file: .opentofu-version

      # 讀不到版本檔時 action 只發警告、改裝 latest，在這裡擋下
      - run: tofu version | grep -xF "OpenTofu v$(cat ../.opentofu-version)" >/dev/null
      - run: tofu init -input=false
      - run: tofu plan -input=false -lock-timeout=5m -out=tfplan
      - run: tofu apply -input=false -lock-timeout=5m tfplan
