name: opentofu

on:
  pull_request:
    paths:
      - "infra/**"
      - ".opentofu-version"
      - ".opentofu-checksums"
      - ".github/workflows/opentofu.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".opentofu-version"
      - ".opentofu-checksums"
      - ".github/workflows/opentofu.yml"

permissions:
  contents: read
  id-token: write # 讓 job 能向 GitHub 取得 OIDC token，換 AWS 臨時憑證

concurrency:
  group: opentofu-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-east-2

defaults:
  run:
    working-directory: infra

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 版本和安裝檔雜湊都從 repo 讀，和 make tofu 比對同一份；讀不到就在這裡失敗。
      # runner 是 ubuntu-latest，所以取 linux_amd64 的雜湊。
      - id: tofu
        run: |
          version="$(cat ../.opentofu-version)"
          sum="$(awk -v f="tofu_${version}_linux_amd64.zip" '$2 == f { print $1 }' ../.opentofu-checksums)"
          test -n "$sum"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ steps.tofu.outputs.version }}
          checksums: ${{ steps.tofu.outputs.checksum }}

      - run: tofu fmt -check -recursive
      - run: tofu init -input=false
      - run: tofu validate
      - run: tofu plan -input=false -lock-timeout=5m

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 不要在這個 job 加 environment:。加了之後 OIDC 的 sub 會變成
    # repo:OWNER/REPO:environment:NAME，apply 角色的信任政策就不會符合。
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 版本和安裝檔雜湊都從 repo 讀，和 make tofu 比對同一份；讀不到就在這裡失敗。
      # runner 是 ubuntu-latest，所以取 linux_amd64 的雜湊。
      - id: tofu
        run: |
          version="$(cat ../.opentofu-version)"
          sum="$(awk -v f="tofu_${version}_linux_amd64.zip" '$2 == f { print $1 }' ../.opentofu-checksums)"
          test -n "$sum"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ steps.tofu.outputs.version }}
          checksums: ${{ steps.tofu.outputs.checksum }}

      - run: tofu init -input=false
      - run: tofu plan -input=false -lock-timeout=5m -out=tfplan
      - run: tofu apply -input=false -lock-timeout=5m tfplan
